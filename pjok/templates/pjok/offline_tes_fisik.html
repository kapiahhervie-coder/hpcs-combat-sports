<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tes Fisik Offline — Fase {{ fase }}</title>
<style>
  :root{
    --bg:#101514; --surface:#171d1c; --surface-2:#1c2422; --border:#293330;
    --gold:#38bdf8; --gold-dim:#2b6f8f;
    --ok:#22c55e; --warn:#f59e0b; --danger:#f87171;
    --text:#efe9df; --text-dim:#a89f8f; --text-faint:#6f6759;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,Segoe UI,Inter,sans-serif; padding-bottom:60px; }
  .wrap{ max-width:640px; margin:0 auto; padding:18px; }

  .topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .title{ font-size:19px; font-weight:700; }
  .subtitle{ font-size:12px; color:var(--text-faint); margin-top:2px; }
  .back-link{ color:var(--gold); text-decoration:none; font-size:12.5px; }

  .status-pill{ display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; padding:5px 12px; border-radius:20px; letter-spacing:.03em; }
  .status-online{ background:rgba(34,197,94,.15); color:var(--ok); }
  .status-offline{ background:rgba(248,113,113,.15); color:var(--danger); }
  .status-dot{ width:7px; height:7px; border-radius:50%; background:currentColor; }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:18px; margin-bottom:14px; }
  .card-head{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint); margin-bottom:14px; font-weight:700; }

  .field-group{ margin-bottom:12px; }
  .field-label{ font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--text-faint); margin-bottom:5px; display:block; }
  .field-input, select.field-input{ width:100%; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:11px 12px; color:var(--text); font-size:15px; }
  .field-input:focus{ outline:none; border-color:var(--gold); }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  .btn{ width:100%; border:none; border-radius:8px; padding:14px; font-weight:700; font-size:14px; cursor:pointer; }
  .btn-save{ background:linear-gradient(90deg,#0f766e,#14b8a6); color:#fff; }
  .btn-sync{ background:linear-gradient(90deg,#1d4ed8,#38bdf8); color:#fff; margin-top:10px; }
  .btn-sync:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-clear{ background:transparent; border:1px solid var(--border); color:var(--text-dim); font-size:12px; padding:8px 12px; width:auto; }

  .queue-item{ display:flex; justify-content:space-between; align-items:center; padding:10px 12px; background:var(--surface-2); border-radius:6px; margin-bottom:8px; font-size:13px; }
  .queue-item-status{ font-size:10px; font-weight:700; padding:3px 8px; border-radius:10px; }
  .qs-pending{ background:rgba(245,158,11,.15); color:var(--warn); }
  .qs-synced{ background:rgba(34,197,94,.15); color:var(--ok); }
  .qs-error{ background:rgba(248,113,113,.15); color:var(--danger); }
  .queue-empty{ color:var(--text-faint); font-size:13px; text-align:center; padding:16px 0; }
  .del-btn{ background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:14px; padding:2px 6px; }

  .toast{ position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--surface); border:1px solid var(--gold-dim); color:var(--text); padding:12px 20px; border-radius:8px; font-size:13px; display:none; z-index:100; max-width:90%; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <div class="title">Tes Fisik Offline</div>
      <div class="subtitle">Fase {{ fase }} ({{ jenjang }})</div>
    </div>
    <span id="statusPill" class="status-pill status-offline"><span class="status-dot"></span><span id="statusText">Memeriksa...</span></span>
  </div>

  <a class="back-link" href="{% url 'pjok:dashboard_fase' fase %}">&larr; Kembali ke Dashboard</a>
  <br><br>

  <div class="card">
    <div class="card-head">Input Data Tes Fisik</div>

    <div class="field-group">
      <label class="field-label">Siswa</label>
      <select id="inputSiswa" class="field-input">
        <option value="">-- Pilih Siswa --</option>
      </select>
    </div>

    <div class="field-row">
      <div class="field-group">
        <label class="field-label">Plank Hold (detik)</label>
        <input type="number" step="0.1" id="inputPlank" class="field-input">
      </div>
      <div class="field-group">
        <label class="field-label">Sit &amp; Reach (cm)</label>
        <input type="number" step="0.1" id="inputReach" class="field-input">
      </div>
    </div>
    <div class="field-row">
      <div class="field-group">
        <label class="field-label">Gantung Siku (detik)</label>
        <input type="number" step="0.1" id="inputGantung" class="field-input">
      </div>
      <div class="field-group">
        <label class="field-label">Sit Up (repetisi)</label>
        <input type="number" step="1" id="inputSitup" class="field-input">
      </div>
    </div>
    <div class="field-row">
      <div class="field-group">
        <label class="field-label">Vertical Jump (cm)</label>
        <input type="number" step="0.1" id="inputVJump" class="field-input">
      </div>
      <div class="field-group">
        <label class="field-label">Broad Jump (cm) — opsional</label>
        <input type="number" step="0.1" id="inputBJump" class="field-input">
      </div>
    </div>
    <div class="field-row">
      <div class="field-group">
        <label class="field-label">Lari Cepat (detik)</label>
        <input type="number" step="0.1" id="inputLariCepat" class="field-input">
      </div>
      <div class="field-group">
        <label class="field-label">Lari Menengah (detik)</label>
        <input type="number" step="0.1" id="inputLariMenengah" class="field-input">
      </div>
    </div>

    <button class="btn btn-save" onclick="simpanKeAntrian()">+ Simpan ke Antrian</button>
  </div>

  <div class="card">
    <div class="card-head">Antrian Belum Tersinkron (<span id="jumlahAntrian">0</span>)</div>
    <div id="daftarAntrian"><div class="queue-empty">Belum ada data di antrian.</div></div>
    <button class="btn btn-sync" id="btnSync" onclick="sinkronkanSemua()">&#8635; Sinkronkan Sekarang</button>
    <div style="text-align:center;margin-top:10px;">
      <button class="btn-clear" onclick="hapusSemuaAntrian()">Hapus Semua Antrian</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var FASE = "{{ fase }}";
var SISWA_LIST = {{ siswa_json|safe }};
var STORAGE_KEY = "pjok_offline_tesfisik_" + FASE;
var CSRF_TOKEN = "{{ csrf_token }}";
var SYNC_URL = "{% url 'pjok:api_sync_tes_fisik' %}";

// --- Isi dropdown siswa ---
var selSiswa = document.getElementById('inputSiswa');
SISWA_LIST.forEach(function(s){
  var opt = document.createElement('option');
  opt.value = s.id;
  opt.textContent = s.nama + ' (' + s.kelas + ')';
  selSiswa.appendChild(opt);
});

// --- Status online/offline ---
function updateStatus(){
  var pill = document.getElementById('statusPill');
  var text = document.getElementById('statusText');
  if (navigator.onLine) {
    pill.className = 'status-pill status-online';
    text.textContent = 'Online';
  } else {
    pill.className = 'status-pill status-offline';
    text.textContent = 'Offline — data disimpan lokal';
  }
}
window.addEventListener('online', function(){ updateStatus(); sinkronkanSemua(); });
window.addEventListener('offline', updateStatus);
updateStatus();

// --- Penyimpanan lokal (localStorage) ---
function ambilAntrian(){
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch(e){ return []; }
}
function simpanAntrian(list){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}
function tampilkanToast(pesan){
  var t = document.getElementById('toast');
  t.textContent = pesan;
  t.style.display = 'block';
  setTimeout(function(){ t.style.display = 'none'; }, 3000);
}

function simpanKeAntrian(){
  var siswaId = selSiswa.value;
  if (!siswaId) { tampilkanToast('Pilih siswa dulu.'); return; }

  var wajib = [
    ['inputPlank','Plank Hold'], ['inputReach','Sit & Reach'], ['inputGantung','Gantung Siku'],
    ['inputSitup','Sit Up'], ['inputVJump','Vertical Jump'],
    ['inputLariCepat','Lari Cepat'], ['inputLariMenengah','Lari Menengah'],
  ];
  for (var i=0; i<wajib.length; i++){
    var el = document.getElementById(wajib[i][0]);
    if (el.value === '') { tampilkanToast(wajib[i][1] + ' belum diisi.'); return; }
  }

  var siswaNama = selSiswa.options[selSiswa.selectedIndex].textContent;
  var entry = {
    local_id: 'local_' + Date.now() + '_' + Math.random().toString(36).slice(2,8),
    siswa_id: parseInt(siswaId, 10),
    siswa_nama: siswaNama,
    plank_hold_detik: parseFloat(document.getElementById('inputPlank').value),
    sit_and_reach_cm: parseFloat(document.getElementById('inputReach').value),
    gantung_durasi_tercapai_detik: parseFloat(document.getElementById('inputGantung').value),
    sit_up_repetisi: parseInt(document.getElementById('inputSitup').value, 10),
    vertical_jump_cm: parseFloat(document.getElementById('inputVJump').value),
    standing_broad_jump_cm: document.getElementById('inputBJump').value ? parseFloat(document.getElementById('inputBJump').value) : null,
    lari_cepat_detik: parseFloat(document.getElementById('inputLariCepat').value),
    lari_menengah_detik: parseFloat(document.getElementById('inputLariMenengah').value),
    status: 'pending',
  };

  var antrian = ambilAntrian();
  antrian.push(entry);
  simpanAntrian(antrian);
  renderAntrian();

  // Reset form
  ['inputPlank','inputReach','inputGantung','inputSitup','inputVJump','inputBJump','inputLariCepat','inputLariMenengah'].forEach(function(id){
    document.getElementById(id).value = '';
  });
  selSiswa.value = '';

  tampilkanToast('Tersimpan di antrian lokal.');
  if (navigator.onLine) sinkronkanSemua();
}

function renderAntrian(){
  var antrian = ambilAntrian();
  var container = document.getElementById('daftarAntrian');
  document.getElementById('jumlahAntrian').textContent = antrian.filter(function(e){ return e.status !== 'synced'; }).length;

  if (antrian.length === 0) {
    container.innerHTML = '<div class="queue-empty">Belum ada data di antrian.</div>';
    return;
  }

  container.innerHTML = '';
  antrian.forEach(function(entry, idx){
    if (entry.status === 'synced') return; // sudah sinkron, tidak ditampilkan lagi
    var div = document.createElement('div');
    div.className = 'queue-item';
    var statusClass = entry.status === 'error' ? 'qs-error' : 'qs-pending';
    var statusLabel = entry.status === 'error' ? 'GAGAL' : 'MENUNGGU';
    div.innerHTML =
      '<span>' + entry.siswa_nama + '</span>' +
      '<span style="display:flex;align-items:center;gap:8px;">' +
        '<span class="queue-item-status ' + statusClass + '">' + statusLabel + '</span>' +
        '<button class="del-btn" onclick="hapusSatuAntrian(\\'' + entry.local_id + '\\')">&#10005;</button>' +
      '</span>';
    container.appendChild(div);
  });

  if (container.innerHTML === '') {
    container.innerHTML = '<div class="queue-empty">Semua data sudah tersinkron.</div>';
  }
}

function hapusSatuAntrian(localId){
  var antrian = ambilAntrian().filter(function(e){ return e.local_id !== localId; });
  simpanAntrian(antrian);
  renderAntrian();
}

function hapusSemuaAntrian(){
  if (!confirm('Hapus semua data di antrian? Data yang belum tersinkron akan hilang.')) return;
  simpanAntrian([]);
  renderAntrian();
}

function sinkronkanSemua(){
  if (!navigator.onLine) { tampilkanToast('Masih offline, belum bisa sinkron.'); return; }

  var antrian = ambilAntrian();
  var belumSinkron = antrian.filter(function(e){ return e.status !== 'synced'; });
  if (belumSinkron.length === 0) { tampilkanToast('Tidak ada data yang perlu disinkronkan.'); return; }

  var btn = document.getElementById('btnSync');
  btn.disabled = true;
  btn.textContent = 'Menyinkronkan...';

  fetch(SYNC_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF_TOKEN },
    body: JSON.stringify({ entries: belumSinkron }),
  })
  .then(function(resp){ return resp.json(); })
  .then(function(data){
    var hasilMap = {};
    (data.hasil || []).forEach(function(h){ hasilMap[h.local_id] = h; });

    var antrianTerbaru = ambilAntrian().map(function(e){
      var h = hasilMap[e.local_id];
      if (h && h.status === 'ok') { e.status = 'synced'; }
      else if (h && h.status === 'error') { e.status = 'error'; e.pesan_error = h.pesan; }
      return e;
    }).filter(function(e){ return e.status !== 'synced'; }); // buang yang sudah sukses dari penyimpanan

    simpanAntrian(antrianTerbaru);
    renderAntrian();

    var jumlahSukses = (data.hasil || []).filter(function(h){ return h.status === 'ok'; }).length;
    var jumlahGagal = (data.hasil || []).filter(function(h){ return h.status === 'error'; }).length;
    tampilkanToast(jumlahSukses + ' data tersinkron' + (jumlahGagal > 0 ? ', ' + jumlahGagal + ' gagal.' : '.'));
  })
  .catch(function(err){
    tampilkanToast('Gagal sinkron: koneksi bermasalah. Data tetap aman di lokal.');
  })
  .finally(function(){
    btn.disabled = false;
    btn.textContent = '\u21BB Sinkronkan Sekarang';
  });
}

renderAntrian();
if (navigator.onLine) sinkronkanSemua();

// --- Daftarkan Service Worker supaya halaman ini bisa dibuka tanpa internet ---
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('{% url "pjok:offline_sw" fase %}').catch(function(err){
      console.warn('Service worker gagal didaftarkan:', err);
    });
  });
}
</script>
</body>
</html>
