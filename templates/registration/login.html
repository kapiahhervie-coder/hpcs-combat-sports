<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login HPCS</title>
  <style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:sans-serif;background:#f3f4f6;min-height:100vh;display:flex;align-items:center;justify-content:center}.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:2rem;width:380px}.brand{text-align:center;margin-bottom:1.5rem}h1{font-size:20px;font-weight:600}label{display:block;font-size:12px;color:#6b7280;margin-bottom:4px}input{width:100%;padding:9px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;margin-bottom:1rem}.btn{width:100%;padding:10px;background:#111827;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer}.error{background:#FCEBEB;color:#A32D2D;font-size:13px;padding:10px;border-radius:8px;margin-bottom:1rem}</style>
</head>
<body>
<div class="card">
  <div class="brand"><div style="font-size:32px">⚔</div><h1>HPCS</h1><p style="font-size:11px;color:#9ca3af">High Performance Combat Sports</p></div>
  <form method="post">
    {% csrf_token %}
    {% if form.errors %}<div class="error">Username atau password salah.</div>{% endif %}
    <label>Username</label>
    <input type="text" name="username" autofocus value="{{ form.username.value|default:'' }}">
    <label>Password</label>
    <input type="password" name="password">
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <button type="submit" class="btn">Masuk</button>
  </form>
</div>
</body>
</html>
