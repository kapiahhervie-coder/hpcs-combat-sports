<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Coach — HPCS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#070a10;color:#e2e8f0;font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#0d0f18;border:1px solid rgba(255,255,255,0.07);border-radius:16px;width:100%;max-width:480px;overflow:hidden}
.card-header{background:linear-gradient(135deg,#10122a 0%,#0b0d1a 100%);border-bottom:1px solid rgba(255,255,255,0.06);padding:28px 32px}
.logo{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;letter-spacing:1px;color:#fff;margin-bottom:4px}
.logo span{color:#e63946}
.subtitle{font-size:12px;color:#64748b;letter-spacing:.5px}
.card-body{padding:28px 32px}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#64748b;margin-bottom:6px}
.form-group input,.form-group select{width:100%;background:#111626;border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:10px 14px;color:#e2e8f0;font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s}
.form-group input:focus,.form-group select:focus{border-color:#e63946}
.form-group input[type="file"]{padding:8px 14px;cursor:pointer;color:#64748b}
.form-group select option{background:#111626}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.btn-submit{width:100%;background:#e63946;border:none;border-radius:8px;padding:12px;color:#fff;font-size:13px;font-weight:700;letter-spacing:.5px;cursor:pointer;margin-top:8px;transition:opacity .2s;font-family:'Inter',sans-serif}
.btn-submit:hover{opacity:.85}
.divider{height:1px;background:rgba(255,255,255,0.05);margin:20px 0}
.login-link{text-align:center;font-size:12px;color:#64748b}
.login-link a{color:#e63946;text-decoration:none;font-weight:600}
.alert{padding:10px 14px;border-radius:8px;font-size:12px;margin-bottom:16px}
.alert-error{background:rgba(230,57,70,0.1);border:1px solid rgba(230,57,70,0.25);color:#fca5a5}
.alert-success{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.25);color:#6ee7b7}
.foto-preview{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,0.1);display:none;margin-bottom:8px}
</style>
</head>
<body>
<div class="card">
  <div class="card-header">
    <div class="logo"><span>HPCS</span> Combat Sports</div>
    <div class="subtitle">Pendaftaran Akun Pelatih</div>
  </div>
  <div class="card-body">

    {% if messages %}
      {% for msg in messages %}
        <div class="alert alert-{{ msg.tags }}">{{ msg }}</div>
      {% endfor %}
    {% endif %}

    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="form-group">
        <label>Nama Lengkap</label>
        <input type="text" name="nama_lengkap" placeholder="Nama lengkap pelatih" required>
      </div>

      <div class="row-2">
        <div class="form-group">
          <label>Username</label>
          <input type="text" name="username" placeholder="username" required>
        </div>
        <div class="form-group">
          <label>Cabang Olahraga</label>
          <select name="cabang" required>
            <option value="">-- Pilih --</option>
            <option value="boxing">Boxing</option>
            <option value="muaythai">Muay Thai</option>
            <option value="karate">Karate</option>
            <option value="tkd">Taekwondo</option>
            <option value="judo">Judo</option>
            <option value="mma">MMA</option>
          </select>
        </div>
      </div>

      <div class="row-2">
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password1" placeholder="Password" required>
        </div>
        <div class="form-group">
          <label>Konfirmasi Password</label>
          <input type="password" name="password2" placeholder="Ulangi password" required>
        </div>
      </div>

      <div class="row-2">
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" placeholder="email@domain.com">
        </div>
        <div class="form-group">
          <label>No. HP / WhatsApp</label>
          <input type="text" name="no_hp" placeholder="08xx-xxxx-xxxx">
        </div>
      </div>

      <div class="form-group">
        <label>Foto Profil (opsional)</label>
        <img id="fotoPreview" class="foto-preview" src="#" alt="Preview">
        <input type="file" name="foto" accept="image/*" onchange="previewFoto(this)">
      </div>

      <button type="submit" class="btn-submit">Daftar Sekarang</button>
    </form>

    <div class="divider"></div>
    <div class="login-link">Sudah punya akun? <a href="{% url 'login' %}">Login di sini</a></div>
  </div>
</div>

<script>
function previewFoto(input) {
  const preview = document.getElementById('fotoPreview');
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = e => { preview.src = e.target.result; preview.style.display = 'block'; };
    reader.readAsDataURL(input.files[0]);
  }
}
</script>
</body>
</html>
